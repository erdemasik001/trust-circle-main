[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 10_000
via_ir = false
ffi = false
gas_reports = ["TrustCircle", "ReputationEngine", "InsurancePool"]

[profile.default.fuzz]
runs = 512
max_test_rejects = 65536

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
worldchain_sepolia = "${WORLDCHAIN_SEPOLIA_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[etherscan]
worldchain_sepolia = { key = "${WORLDSCAN_API_KEY}", url = "https://sepolia.worldscan.org/api" }
